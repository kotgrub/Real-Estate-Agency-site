                    </table>
                    <table class="inlist">

                    </table>
                    <table class="inlist">

            <table class="product">
                <td>
                    <table>
                        <td><img src="Images/House_1.webp" width="250px" height="250px"></td>
                    </table>
                </td>
                <td>
                    <table>
                        <td>2-эт. дом</td>
                        <td>258 м<sup>2</sup></td>
                        <td>15,06 сот.</td>
                        <td>ИЖС</td>
                    </table>
                </td>
            </table>
            <table class="product">
                <td>a</td>
            </table>
            <table class="product">
                <td>a</td>
            </table>
